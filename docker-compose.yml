

services:
  postgres:
    image: postgres:16
    container_name: project1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_airflow.sql:/docker-entrypoint-initdb.d/init_airflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  airflow-init:
    image: apache/airflow:2.10.5
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "${AIRFLOW_UID}:0"
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        if ! airflow users list | grep -q "${AIRFLOW_ADMIN_USERNAME}"; then
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --firstname Project \
            --lastname Admin \
            --role Admin \
            --email admin@example.com \
            --password "$${AIRFLOW_ADMIN_PASSWORD}"
        fi
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.10.5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    user: "${AIRFLOW_UID}:0"
    ports:
      - "8080:8080"
    volumes: *airflow-volumes
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped


volumes:
  postgres_data:

